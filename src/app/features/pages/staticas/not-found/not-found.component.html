 <div class="not-found-container" [class.dark]="themeService.currentTheme() === 'dark'">
  <!-- Capa de fondo con imagen y superposición -->
  <div class="background-image"></div>
  <div class="background-overlay"></div>
  
  <!-- Capa decorativa con el 404 y elementos flotantes -->
  <div class="decor-layer">
    <div class="big-404">404</div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Tarjeta principal de contenido -->
  <main class="content-card">
    <header>
      <span class="badge">ERROR DE NAVEGACIÓN</span>
      <div class="icon-wrapper">
        <mat-icon>map</mat-icon>
      </div>
      <h1 class="title">Página no <span>encontrada</span></h1>
    </header>

    <section class="body">
      <p>Lo sentimos, el enlace que has seguido puede estar roto o la página ha sido eliminada.</p>
    </section>

    <footer>
      <button mat-flat-button class="main-cta" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        VOLVER ATRÁS
      </button>

      <div class="aux-nav">
        <a routerLink="/help">Centro de ayuda</a>
        <span class="dot"></span>
        <a routerLink="/contact">Reportar un error</a>
      </div>
    </footer>
  </main>

  <footer class="simple-footer">
    <p>&copy; {{ currentYear }} JLRN-Gamosa1956 - Todos los derechos reservados</p>
  </footer>
</div>
