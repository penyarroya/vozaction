 <div class="welcome-wrapper">
  <header class="top-nav">
    <div class="logo">
      <img src="/ico/logo.ico" alt="SeniorClick Logo" class="logo-img">
    </div>

    <div class="nav-actions">
      <!-- Botón "Quiénes somos" -->
      <div class="action-item">
        <button mat-icon-button routerLink="/about" class="circle-btn">
          <mat-icon>info</mat-icon>
        </button>
        <span class="action-label">Acerca De..</span>
      </div>
      
      <!-- Botón "Iniciar Sesión" -->
      <div class="action-item">
        <button mat-icon-button routerLink="/login" class="login-circle-btn">
          <mat-icon>account_circle</mat-icon>
        </button>
        <span class="action-label">Login</span>
      </div>
    </div>
  </header>

  <!-- Carrusel de fondo -->
  <div class="carousel-background">
    @for (slide of slides(); track slide; let i = $index) {
      <div 
        class="slide" 
        [style.backgroundImage]="'url(/' + slide + ')'"
        [style.animationDuration]="totalDuration() + 's'" 
        [style.animationDelay]="(i * 5) + 's'">
      </div>
    }
    <div class="overlay"></div> 
  </div>

  <!-- Contenido principal (hero) -->
  <div class="content-overlay">
    <section class="hero-container">
      <h1 class="title">VozAcción</h1>
      <p class="subtitle">
        El <span class="highlight">Universo de la </span>Palabra 
      </p>
    </section>
  </div>
</div>
