<app-transparent-toolbar
  [config]="toolbarConfig()"
  [greeting]="greeting"
  [userNameDisplay]="userName"
  [userEmailDisplay]="userEmail"
  [currentTimeDisplay]="formattedCurrentTime"
  [showUserGreeting]="true"
  (mobileMenuClick)="toggleMobileSidebar()"
  (search)="onSearch($event)"
  (help)="showHelp()"
  (login)="goToLogin()">
</app-transparent-toolbar>

<div class="maintenance-layout">
  
  <div class="sidebar-wrapper" [class.open]="isMobileSidebarOpen()">
    <app-entity-sidebar
      [selectedEntity]="selectedEntity()?.name || ''"
      (onSelect)="onSelectEntityByName($event)">
    </app-entity-sidebar>
    <button class="close-sidebar-mobile" (click)="toggleMobileSidebar()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <main class="maintenance-main">
    @if (selectedEntity(); as currentEntity) {
      <header class="maintenance-toolbar">
        <div class="toolbar-title">
          <h1>{{ currentEntity.label }}</h1>
        </div>
      </header>

      <div class="content-body">
        @if (!showForm()) {
          <app-entity-table
            [config]="selectedEntityConfig()"
            [showActions]="true"
            (onCrear)="openCreateForm()"
            (onEdit)="editEntityItem($event)"
            (onDelete)="deleteEntityItem($event)"
            (onBack)="volverAtras()">
          </app-entity-table>
        } @else {
          <app-entity-form
            [entity]="selectedEntity()?.name || ''"
            [data]="currentData()"
            [isEditing]="isEditing()"
            [loading]="loading()"
            (onSave)="handleSave($event)"
            (onCancel)="closeForm()">
          </app-entity-form>
        }
      </div>
    } @else {
      <div class="welcome-placeholder">
        <div class="placeholder-content">
          <mat-icon class="large-icon">dns</mat-icon>
          <h2>Panel de Mantenimiento de Base de Datos</h2>
          <p>Selecciona una entidad en el menú lateral izquierdo para comenzar a ver y gestionar sus registros.</p>
        </div>
      </div>
    }
  </main>
</div>
