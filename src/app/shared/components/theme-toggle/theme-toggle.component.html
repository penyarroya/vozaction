@if (isVisible()) { 
  <button 
    class="theme-toggle-btn" 
    (click)="toggleTheme()" 
    [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    [title]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  >
    @if (isDark()) {
      <span class="icon sun">☀️</span>
    } @else {
      <span class="icon moon">🌙</span>
    }
  </button>
}
